version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    ignore:
      # mcp 2.x changes the server API; upgrade by hand.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
