name: Bug report
description: Something did not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The tool calls you sent and what came back. A `--trace` file is ideal.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: roarm-mcp version, OS, Python version, MCP client
    validations:
      required: true
