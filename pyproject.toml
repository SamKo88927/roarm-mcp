[project]
name = "roarm-mcp"
version = "0.1.1"
description = "MCP server that lets LLM agents drive a Waveshare RoArm-M3, with every motion checked in MuJoCo first."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sam Ko" }]
requires-python = ">=3.11"
keywords = ["mcp", "robotics", "mujoco", "llm", "agents", "roarm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.30,<2",
    "mujoco>=3.2",
    "numpy>=1.26",
    "pydantic>=2.7",
]

[project.optional-dependencies]
render = ["imageio>=2.34", "pillow>=10"]
real = ["pyserial>=3.5"]

[project.scripts]
roarm-mcp = "roarm_mcp.cli:main"

[project.urls]
Repository = "https://github.com/SamKo88927/roarm-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "pyserial>=3.5",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
